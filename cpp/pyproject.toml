[build-system]
# scikit-build-core 0.11: PEP 639 license expressions and license-files.
requires = ["scikit-build-core>=0.11", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "regresslens-accel"
version = "0.2.0"
description = "Optional native (scalar + AVX2) kernels for RegressLens"
readme = "README.md"
requires-python = ">=3.9"
# An SPDX expression replaces the "License ::" classifier (PEP 639);
# build backends reject the two together.
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.22"]
keywords = ["numpy", "simd", "avx2", "kernels", "compensated-summation", "regresslens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/aryan-singh326/RegressLens"
Source = "https://github.com/aryan-singh326/RegressLens/tree/main/cpp"
Issues = "https://github.com/aryan-singh326/RegressLens/issues"
Documentation = "https://github.com/aryan-singh326/RegressLens/blob/main/docs/kernels.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["regresslens_accel"]
# Development tools stay out of the wheel build (no gbench fetch, no tests).
# CMAKE_BUILD_TYPE is explicit because single-config generators on Windows
# (NMake, used when only the VS Build Tools are installed) default MSVC
# builds to Debug otherwise.
cmake.define = { CMAKE_BUILD_TYPE = "Release", REGRESSLENS_BUILD_TESTS = "OFF", REGRESSLENS_BUILD_CHARACTERIZE = "OFF", REGRESSLENS_BUILD_BENCH = "OFF" }
sdist.exclude = ["build/", "bench/results/"]

[tool.cibuildwheel]
# Explicit list: it keeps out free-threaded builds (cp314t: the extension
# does not declare free-threading support) and CPython 3.15 (built by
# default since cibuildwheel 4.2, but untested here).
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-verbosity = 1
# The full Python suite runs against every built wheel, including a
# pass with the AVX2 kernels disabled (RGLNS_FORCE_KERNEL=scalar).
test-requires = ["pytest", "hypothesis"]
test-command = "python {project}/tools/run_wheel_tests.py {project}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Built natively on separate x86_64 and arm64 runners; no universal2.
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
