[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "regresslens"
version = "0.2.0"
description = "Performance regression intelligence for recurring scientific Python/NumPy pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]

[project.optional-dependencies]
# Native scalar + AVX2 kernels (binary wheels). Everything works without them.
accel = ["regresslens-accel>=0.2,<0.3"]
dev = ["pytest", "hypothesis"]

[project.scripts]
rglns = "regresslens.cli:main"

[project.urls]
Homepage = "https://github.com/aryan-singh326/RegressLens"

[tool.setuptools.packages.find]
include = ["regresslens*"]

[tool.setuptools.package-data]
regresslens = ["_boot/sitecustomize.py", "telemetry_schema.json"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running statistical or end-to-end validation (deselect with -m 'not slow')",
]
