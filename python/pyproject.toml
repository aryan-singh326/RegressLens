[project]
name = "regresslens"
version = "0.1.0.dev0"
description = "Performance regression intelligence for recurring scientific Python/NumPy pipelines"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
]
license = {text = "Apache-2.0"}

[project.scripts]
rglns = "regresslens.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# CMakeLists.txt lives alongside this pyproject.toml (python/), and
# deliberately builds ONLY the native extension -- see that file's
# header comment for why it's separate from cpp/CMakeLists.txt.
cmake.source-dir = "."
wheel.packages = ["regresslens"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
