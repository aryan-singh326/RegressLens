[project]
name = "regresslens"
version = "0.1.0.dev0"
description = "Performance regression intelligence for recurring scientific Python/NumPy pipelines"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
]
license = {text = "Apache-2.0"}

[project.scripts]
rglns = "regresslens.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["regresslens"]

[tool.setuptools.package-data]
regresslens = ["*.so"]
