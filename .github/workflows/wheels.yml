# Builds and publishes both distributions:
#   regresslens        pure Python, py3-none-any (python/)
#   regresslens-accel  native kernels, one wheel per platform/CPython (cpp/)
# The full test suite runs inside every accel wheel build (cibuildwheel,
# see cpp/pyproject.toml), once with automatic dispatch and once with
# RGLNS_FORCE_KERNEL=scalar. Fresh-environment install checks then run
# `rglns --help` and `rglns run` from the built wheels on every platform.
# Publishing uses PyPI Trusted Publishing (OIDC): no API tokens are stored.
name: wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["cpp/**", "python/pyproject.toml", ".github/workflows/wheels.yml"]
  workflow_dispatch:

jobs:
  accel:
    name: accel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # manylinux_2_28 x86_64 / aarch64, macOS x86_64 / arm64, Windows amd64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # 4.x builds CPython 3.9-3.15 (the selection is in cpp/pyproject.toml).
      - uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: cpp
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: accel-${{ matrix.os }}
          path: wheelhouse/*.whl

  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel --sdist --outdir dist python
      - run: python -m build --sdist --outdir dist cpp
      - name: The pure wheel must be py3-none-any
        run: ls dist/*-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: pure
          path: dist/*

  install-check:
    # Fresh environment per platform: install from the built artifacts only.
    needs: [accel, pure]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Every artifact carries the license and complete metadata
        if: matrix.os == 'ubuntu-latest'
        shell: python
        run: |
          import email, glob, os, tarfile, zipfile
          files = sorted(glob.glob("artifacts/*.whl") + glob.glob("artifacts/*.tar.gz"))
          assert files, "no artifacts"
          for path in files:
              if path.endswith(".whl"):
                  z = zipfile.ZipFile(path)
                  names, read = z.namelist(), z.read
              else:
                  t = tarfile.open(path)
                  names = t.getnames()
                  read = lambda n: t.extractfile(n).read()
              lic = [n for n in names if os.path.basename(n) == "LICENSE"]
              assert lic and b"Apache License" in read(lic[0]), f"{path}: no LICENSE"
              meta_name = [n for n in names if n.endswith((".dist-info/METADATA", "/PKG-INFO"))
                           and n.count("/") == 1][0]
              meta = email.message_from_bytes(read(meta_name))
              assert meta["License-Expression"] == "Apache-2.0", f"{path}: {meta['License-Expression']}"
              assert meta.get_all("License-File"), f"{path}: no License-File"
              assert any(c.endswith(":: 3.14") for c in meta.get_all("Classifier")), path
              print(f"ok  {os.path.basename(path)}: {lic[0]}")
      - name: Install regresslens[accel] from the built wheels
        shell: bash
        run: |
          python -m venv fresh
          if [ -f fresh/Scripts/python.exe ]; then PY=fresh/Scripts/python.exe; else PY=fresh/bin/python; fi
          $PY -m pip install --find-links artifacts "regresslens[accel]"
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: rglns --help and rglns run
        shell: bash
        run: |
          $PY -m regresslens.cli --help
          printf 'import numpy as np\nimport regresslens as rl\nprint(rl.accel_info())\nnp.convolve(np.ones(1000), np.ones(5))\nprint(rl.array(np.ones(10)).sum())\n' > sample.py
          $PY -m regresslens.cli run -- python sample.py
          $PY -c "import platform, regresslens as rl; i = rl.accel_info(); print(platform.machine(), i); \
            assert i['native']; assert (i['isa'] == 'avx2') == (i.get('cpu_avx2_fma') and platform.machine().lower() in ('x86_64', 'amd64'))"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [install-check]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A partial upload (one project published, the other not) must
          # not block re-running this job: files already on PyPI are skipped.
          skip-existing: true
